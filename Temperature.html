<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Temperature.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Temperature Converter</h1>
        </div>
        <div class="Celsius">
            <label for="Celsius">Enter Temperature in Celsius</label>
            <input type="number" id="Celsius" placeholder="Enter temperature in Celsius here...">
        </div>
        <div class="Kelvin">
            <label for="Kelvin">Temperature in Kelvin</label>
            <input type="number" id="Kelvin" placeholder="Temperature in Kelvin">
        </div>
        <div class="Fahrenheit">
            <label for="Fahrenheit">Temperature in Fahrenheit</label>
            <input type="number" id="Fahrenheit" placeholder="Temperature in Fahrenheit">
        </div>
    </div>
        <script src="Temperature.js" ></script>
</body>
</html>
